<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="ENZO key-sealing flow: your provider keys are encrypted in your browser with AES-256-GCM under your passphrase, stored only in your browser vault, and attached per-request when the server relays calls to providers. The server stores no keys.">
  <title>Where your API keys live (and don't)</title>
  <defs>
    <style><![CDATA[
      .box { fill: #161b22; stroke: #30363d; rx: 8; }
      .box-enzo { fill: #0d1f14; stroke: #238636; }
      .box-danger { fill: #1f0d0d; stroke: #da3633; stroke-dasharray: 6 4; }
      .h { font: 700 15px -apple-system, 'Segoe UI', sans-serif; fill: #e6edf3; }
      .t { font: 400 12.5px -apple-system, 'Segoe UI', sans-serif; fill: #8b949e; }
      .key { font: 700 13px ui-monospace, 'SF Mono', monospace; fill: #58d68d; }
      .flow { stroke: #3fb950; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .never { stroke: #f85149; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      .flow-anim { animation: dash 1.2s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .flow-anim { animation: none; } }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <text x="20" y="30" style="font: 700 18px -apple-system, 'Segoe UI', sans-serif; fill:#e6edf3;">Where your API keys live — and where they never go</text>
  <text x="20" y="50" class="t">Keys are sealed in your browser before anything leaves it. The server is a relay, not a vault.</text>

  <!-- User's browser -->
  <rect x="30" y="75" width="240" height="180" rx="10" class="box"/>
  <text x="50" y="100" class="h">Your browser</text>
  <text x="50" y="122" class="t">You paste a provider key once</text>
  <rect x="50" y="135" width="200" height="44" rx="6" class="box-enzo"/>
  <text x="60" y="154" class="key">sk-… → AES-256-GCM</text>
  <text x="60" y="171" class="t" style="font-size:11px;">sealed under YOUR passphrase</text>
  <text x="50" y="205" class="t">Stored: browser vault only.</text>
  <text x="50" y="222" class="t">Wipe anytime. Recovery file</text>
  <text x="50" y="238" class="t">is optional and yours.</text>

  <!-- ENZO server -->
  <rect x="360" y="75" width="220" height="180" rx="10" class="box"/>
  <text x="380" y="100" class="h">ENZO server</text>
  <text x="380" y="122" class="t">Relays your request to the</text>
  <text x="380" y="138" class="t">provider you picked.</text>
  <text x="380" y="164" class="t">Stores: your projects, agents,</text>
  <text x="380" y="180" class="t">memory — all in your Docker</text>
  <text x="380" y="196" class="t">volumes, on your disk.</text>
  <text x="380" y="226" class="key" style="fill:#f85149;">Stores keys: NEVER</text>
  <text x="380" y="243" class="t">CI test enforces this (keyless boot)</text>

  <!-- Provider -->
  <rect x="680" y="75" width="150" height="180" rx="10" class="box"/>
  <text x="700" y="100" class="h">Provider</text>
  <text x="700" y="122" class="t">OpenRouter · Google AI</text>
  <text x="700" y="138" class="t">Groq · NVIDIA · HF · CF</text>
  <text x="700" y="164" class="t">300+ models,</text>
  <text x="700" y="180" class="t">their normal price,</text>
  <text x="700" y="196" class="t">billed by them to you.</text>

  <!-- Flows -->
  <path d="M 275 165 C 310 165, 325 165, 355 165" class="flow flow-anim"/>
  <text x="290" y="150" class="t" style="font-size:11px;">encrypted key</text>
  <path d="M 585 165 C 620 165, 635 165, 675 165" class="flow flow-anim"/>
  <text x="592" y="150" class="t" style="font-size:11px;">key attached</text>
  <path d="M 585 205 C 620 240, 340 250, 285 235" class="flow flow-anim"/>
  <text x="390" y="252" class="t" style="font-size:11px;">response streams back</text>

  <!-- Middleman crossed out -->
  <rect x="360" y="300" width="220" height="60" rx="10" class="box-danger"/>
  <text x="382" y="325" class="h" style="fill:#f85149;">Middleman / markup</text>
  <text x="382" y="345" class="t">no subscription, no seat fee, no reseller</text>
  <line x1="470" y1="298" x2="470" y2="362" class="never"/>
</svg>
