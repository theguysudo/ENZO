<svg xmlns="http://www.w3.org/2000/svg" width="860" height="510" viewBox="0 0 860 510" role="img" aria-label="ENZO CI pipeline: 7 stages including a black-box security pentest, dependency audits failing on high or critical vulnerabilities, and keyless BYOK boot verification — versus a typical self-hosted AI app CI with type-check and unit tests only.">
  <title>ENZO CI pipeline vs typical self-hosted AI app CI</title>
  <defs>
    <style><![CDATA[
      .h1 { font: 700 18px -apple-system, 'Segoe UI', sans-serif; fill: #1f2328; letter-spacing: 0.2px; }
      .label { font: 600 14px -apple-system, 'Segoe UI', sans-serif; fill: #1f2328; }
      .val { font: 700 15px -apple-system, 'Segoe UI', sans-serif; fill: #0d1117; }
      .sub { font: 400 12.5px -apple-system, 'Segoe UI', sans-serif; fill: #57606a; }
      .bar { fill: #0d1117; transform-box: fill-box; transform-origin: left center; }
      .track { fill: #eaeef2; }
      .bar-other { fill: #afb8c1; transform-box: fill-box; transform-origin: left center; }
      .label-other { font: 600 14px -apple-system, 'Segoe UI', sans-serif; fill: #57606a; }
      .val-other { font: 700 15px -apple-system, 'Segoe UI', sans-serif; fill: #57606a; }
      .axis { stroke: #d0d7de; stroke-width: 1; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      .b1 { animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .b2 { animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both; }
      .b3 { animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.36s both; }
      .b4 { animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.54s both; }
      .b5 { animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.72s both; }
      .b6 { animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.9s both; }
      .b7 { animation: grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.08s both; }
      .v1 { animation: fade 0.35s ease-out 0.85s both; }
      .v2 { animation: fade 0.35s ease-out 1.03s both; }
      .v3 { animation: fade 0.35s ease-out 1.21s both; }
      .v4 { animation: fade 0.35s ease-out 1.39s both; }
      .v5 { animation: fade 0.35s ease-out 1.57s both; }
      .v6 { animation: fade 0.35s ease-out 1.75s both; }
      .v7 { animation: fade 0.35s ease-out 1.93s both; }
      .bt { animation: fade 0.5s ease-out 1.7s both; }
      .vt { animation: fade 0.5s ease-out 1.8s both; }
      @media (prefers-color-scheme: dark) {
        .h1 { fill: #f0f6fc; } .label { fill: #e6edf3; } .sub { fill: #8b949e; }
        .bar { fill: #ffffff; } .track { fill: #21262d; } .val { fill: #f0f6fc; }
        .bar-other { fill: #3d4451; } .val-other { fill: #8b949e; }
        .label-other { fill: #8b949e; } .axis { stroke: #30363d; }
      }
      @media (prefers-reduced-motion: reduce) { .bar, .bar-other, .val, .val-other, .bt, .vt { animation: none; } }
    ]]></style>
  </defs>

  <text x="20" y="32" class="h1">What runs on every push to ENZO's main branch</text>
  <text x="20" y="52" class="sub">7 CI stages — vs the typical self-hosted AI app's 2. Numbers from .github/workflows/ci.yml.</text>

  <text x="20" y="100" class="label">Security checks</text>
  <rect x="290" y="86" width="460" height="22" rx="4" class="track"/>
  <rect x="290" y="86" width="410" height="22" rx="4" class="bar b1"/>
  <text x="840" y="102" class="val v1" text-anchor="end">5 gates</text>
  <text x="20" y="118" class="sub">no key literals · .env never tracked · vault-only key reads</text>

  <text x="20" y="145" class="label">Unit + typecheck</text>
  <rect x="290" y="131" width="460" height="22" rx="4" class="track"/>
  <rect x="290" y="131" width="345" height="22" rx="4" class="bar b2"/>
  <text x="840" y="147" class="val v2" text-anchor="end">298 asserts</text>
  <text x="20" y="163" class="sub">ts strict · every imported file tracked · agent + vault suites</text>

  <text x="20" y="190" class="label">Dependency audit</text>
  <rect x="290" y="176" width="460" height="22" rx="4" class="track"/>
  <rect x="290" y="176" width="310" height="22" rx="4" class="bar b3"/>
  <text x="840" y="192" class="val v3" text-anchor="end">fail on high</text>
  <text x="20" y="208" class="sub">backend + frontend, zero high/critical allowed to merge</text>

  <text x="20" y="235" class="label">Black-box pentest</text>
  <rect x="290" y="221" width="460" height="22" rx="4" class="track"/>
  <rect x="290" y="221" width="460" height="22" rx="4" class="bar b4"/>
  <text x="840" y="237" class="val v4" text-anchor="end">44 asserts</text>
  <text x="20" y="253" class="sub">auth bypass · hostile payloads · IDOR · stream integrity — in CI, on every push</text>

  <text x="20" y="280" class="label">Keyless boot proof</text>
  <rect x="290" y="266" width="460" height="22" rx="4" class="track"/>
  <rect x="290" y="266" width="360" height="22" rx="4" class="bar b5"/>
  <text x="840" y="282" class="val v5" text-anchor="end">verified</text>
  <text x="20" y="298" class="sub">server must boot BYOK with zero provider keys + no onboarding bypass</text>

  <text x="20" y="325" class="label">Prod build</text>
  <rect x="290" y="311" width="460" height="22" rx="4" class="track"/>
  <rect x="290" y="311" width="295" height="22" rx="4" class="bar b6"/>
  <text x="840" y="327" class="val v6" text-anchor="end">+ bundle cap</text>
  <text x="20" y="343" class="sub">vite build · gzipped bundle size budget enforced</text>

  <text x="20" y="370" class="label">Repo hygiene</text>
  <rect x="290" y="356" width="460" height="22" rx="4" class="track"/>
  <rect x="290" y="356" width="245" height="22" rx="4" class="bar b7"/>
  <text x="840" y="372" class="val v7" text-anchor="end">clean</text>
  <text x="20" y="388" class="sub">no large binaries · changelog + agent docs present</text>

  <line x1="20" y1="401" x2="840" y2="401" class="axis"/>

  <text x="20" y="445" class="label-other">Typical self-hosted AI app</text>
  <rect x="290" y="431" width="100" height="22" rx="4" class="bar-other bt"/>
  <text x="840" y="447" class="val-other vt" text-anchor="end">typecheck + a few unit tests</text>

  <text x="20" y="487" class="sub">ENZO: Apache-2.0 · 44k lines of TypeScript · CI green on main · pentest report at docs/SECURITY.md</text>
</svg>
